version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: asendit_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - RAILS_ENV=production
      - DATABASE_URL=postgresql://postgres:password@db:5432/asendit_production
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-your_secret_key_base_here}
      - RAILS_SERVE_STATIC_FILES=true
      - RAILS_LOG_TO_STDOUT=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./log:/rails/log
      - ./tmp:/rails/tmp
    restart: unless-stopped

volumes:
  postgres_data: